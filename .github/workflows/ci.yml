name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile scripts
        run: python -m compileall scripts tests
      - name: Run tests
        run: pytest
      - name: Validate example audit
        run: python scripts/validate_audit.py examples/example-audit.json
