name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate skill manifest
        run: python scripts/validate_skill.py SKILL.md

      - name: Compile scripts
        run: python -m compileall scripts tests

      - name: Run tests
        run: pytest

      - name: Run deterministic benchmark suite
        run: |
          python scripts/evaluate_benchmarks.py \
            --manifest benchmarks/manifest.json \
            --minimum-score 100 \
            -o /tmp/pia-benchmark.json \
            --markdown /tmp/pia-benchmark.md

      - name: Validate semantic challenge corpus
        run: |
          python scripts/validate_challenge_corpus.py \
            --manifest challenges/manifest.json \
            -o /tmp/challenge-corpus.json

      - name: Check example audit integrity
        run: |
          python scripts/check_audit_integrity.py \
            examples/example-audit.json \
            --minimum-coverage 100 \
            -o /tmp/audit-integrity.json

      - name: Evaluate golden audit expectations
        run: |
          python scripts/evaluate_golden_audit.py \
            examples/example-audit.json \
            benchmarks/golden-example.json \
            --minimum-score 100 \
            -o /tmp/golden-evaluation.json

      - name: Validate example audit
        run: python scripts/validate_audit.py examples/example-audit.json

      - name: Smoke deterministic discovery
        run: |
          python scripts/infer_architecture.py . -o /tmp/architecture.json
          python scripts/run_collectors.py . -o /tmp/discovery.json
          python scripts/bootstrap_audit.py /tmp/discovery.json -o /tmp/bootstrap-audit.json

      - name: Re-evaluate example readiness
        run: python scripts/score_readiness.py examples/example-audit.json -o /tmp/scored-example.json

      - name: Build example dashboard
        run: python scripts/build_dashboard.py examples/example-audit.json -o /tmp/project-command-center.html
