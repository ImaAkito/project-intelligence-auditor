[project]
name = "project-intelligence-auditor"
version = "0.2.0"
description = "Evidence-based Codex skill and tooling for technical, product, research, and commercial project auditing."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ImaAkito"}]
dependencies = [
  "jsonschema>=4.21,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
