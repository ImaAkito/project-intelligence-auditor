[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-intelligence-auditor"
version = "0.5.0"
description = "Evidence-based Codex skill and tooling for technical, product, research, readiness, commercial, and semantic project auditing."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "ImaAkito"}]
dependencies = [
  "jsonschema>=4.21,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1"
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
